<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>জগন্নাথ বিশ্ববিদ্যালয় বাস সিডিউল</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C0392B">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --surface-raised: #FBFCFE;
    --ink: #12172A;
    --ink-soft: #4A5268;
    --muted: #8890A2;
    --line: #E1E5EF;
    --line-soft: #EDEFF5;
    --accent: #B8722E;
    --accent-ink: #7A4A1B;

    --c1: #B8722E;
    --c2: #2F8F7E;
    --c3: #B85C6B;
    --c4: #5B63C4;
    --c5: #3F7D53;
    --c6: #8A5A9E;

    --btn-bg: #E1E5EF;
    --btn-text: #12172A;

    --radius-card: 18px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 2px rgba(18,23,42,0.04), 0 10px 24px -12px rgba(18,23,42,0.14);
    --shadow-card-hover: 0 2px 4px rgba(18,23,42,0.05), 0 18px 34px -14px rgba(18,23,42,0.20);
  }

  body.dark-mode {
    --bg: #08080C;
    --surface: #131319;
    --surface-raised: #1B1C24;
    --ink: #F2EEE4;
    --ink-soft: #B0A99C;
    --muted: #706A5F;
    --line: #26262F;
    --line-soft: #1C1D25;
    --accent: #D4B074;
    --accent-ink: #EFD199;

    --c1: #D4B074;
    --c2: #4FB8A0;
    --c3: #D98B8B;
    --c4: #8C93E0;
    --c5: #6FBF8A;
    --c6: #C98AC9;

    --btn-bg: #1B1C24;
    --btn-text: #F2EEE4;

    --shadow-card: inset 0 1px 0 rgba(255,255,255,0.045), 0 1px 0 rgba(212,176,116,0.03), 0 2px 10px rgba(0,0,0,0.4), 0 18px 40px -18px rgba(0,0,0,0.85);
    --shadow-card-hover: inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0 1px rgba(212,176,116,0.16), 0 12px 30px -10px rgba(212,176,116,0.12), 0 26px 54px -18px rgba(0,0,0,0.9);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(1200px 480px at 12% -8%, rgba(184,114,46,0.08), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(91,99,196,0.07), transparent 55%);
    color: var(--ink);
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  body.dark-mode {
    background-image:
      radial-gradient(1200px 480px at 12% -8%, rgba(212,176,116,0.055), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(140,147,224,0.045), transparent 55%),
      radial-gradient(800px 600px at 50% 100%, rgba(79,184,160,0.03), transparent 60%),
      url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    background-repeat: no-repeat, no-repeat, no-repeat, repeat;
    background-attachment: fixed, fixed, fixed, fixed;
    scrollbar-color: rgba(212,176,116,0.35) transparent;
  }

  body.dark-mode::-webkit-scrollbar { width: 10px; }
  body.dark-mode::-webkit-scrollbar-track { background: transparent; }
  body.dark-mode::-webkit-scrollbar-thumb {
    background: rgba(212,176,116,0.25);
    border-radius: 20px;
    border: 2px solid var(--bg);
  }
  body.dark-mode::-webkit-scrollbar-thumb:hover {
    background: rgba(212,176,116,0.4);
  }

  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: saturate(160%) blur(14px);
    background: rgba(238,241,246,0.82);
    border-bottom: 1px solid var(--line);
    transition: background 0.3s ease;
  }

  body.dark-mode .top {
    background: rgba(8,8,12,0.82);
    border-bottom: 1px solid rgba(212,176,116,0.16);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03);
  }

  .top-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 22px 20px 16px;
  }

  .header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-row .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent);
    flex-shrink: 0;
  }

  body.dark-mode .title-row .dot {
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .top-widgets {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .clock-box {
    height: 32px;
    font-size: 13.5px;
    font-weight: 700;
    padding: 0 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    color: var(--accent);
    box-shadow: var(--shadow-card);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  body.dark-mode .clock-box {
    background: rgba(27,28,36,0.7);
    color: var(--accent-ink);
    border-color: rgba(212,176,116,0.22);
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 4px 14px -6px rgba(0,0,0,0.6);
  }

  .theme-btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  body.dark-mode .theme-btn {
    background: rgba(27,28,36,0.7);
    border-color: var(--line);
    color: var(--ink);
  }

  body.dark-mode .theme-btn:hover {
    border-color: rgba(212,176,116,0.45);
    background: rgba(212,176,116,0.08);
    color: var(--accent-ink);
  }

  h1 {
    font-family: 'Noto Serif Bengali', serif;
    font-weight: 500;
    font-size: clamp(22px, 4.2vw, 34px);
    line-height: 1.25;
    color: var(--ink);
    margin: 0;
  }

  body.dark-mode h1 {
    letter-spacing: 0.01em;
    text-shadow: 0 0 28px rgba(212,176,116,0.12);
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 18px;
  }

  .notice-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink, var(--accent));
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 12px;
    padding: 9px 14px;
    margin: 0 0 18px;
    line-height: 1.4;
  }

  .notice-icon {
    flex-shrink: 0;
    font-size: 14px;
  }

  body.dark-mode .notice-banner {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent-ink);
  }

  /* ===== Day-off banner: shown only when today is a non-service day ===== */
  @keyframes dayOffShimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .day-off-banner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    margin: 0 0 14px;
    border-radius: 16px;
    color: #fff;
    background: linear-gradient(100deg, #C0392B, #E0663F, #C0392B);
    background-size: 220% 100%;
    animation: dayOffShimmer 6s linear infinite;
    box-shadow: 0 10px 24px -12px rgba(192,57,43,0.55);
  }

  body.dark-mode .day-off-banner {
    background: linear-gradient(100deg, #7A231A, #B8552F, #7A231A);
    background-size: 220% 100%;
    box-shadow: 0 10px 26px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(212,176,116,0.1);
  }

  .day-off-icon {
    flex-shrink: 0;
    font-size: 26px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  }

  .day-off-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    line-height: 1.35;
  }

  .day-off-text strong {
    font-size: 15px;
    font-weight: 700;
  }

  .day-off-text span {
    font-size: 13px;
    font-weight: 500;
    opacity: 0.92;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--muted);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding: 14px 44px 14px 46px;
    font-size: 15.5px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(18,23,42,0.03);
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  #searchInput::placeholder { color: var(--muted); }

  #searchInput:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(184,114,46,0.14);
  }

  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background .15s ease, color .15s ease;
  }

  .clear-btn.visible { display: flex; }

  .clear-btn:hover {
    background: color-mix(in srgb, var(--accent) 18%, var(--btn-bg));
    color: var(--accent-ink, var(--accent));
  }

  body.dark-mode .clear-btn:hover {
    background: color-mix(in srgb, var(--accent) 16%, var(--btn-bg));
  }

  body.dark-mode #searchInput {
    background: rgba(19,19,25,0.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 2px 8px rgba(0,0,0,0.3);
  }

  body.dark-mode #searchInput:focus {
    border-color: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 0 0 4px rgba(212,176,116,0.14);
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  #results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 16px;
  }

  @media (max-width: 480px) {
    #results { grid-template-columns: 1fr; }
  }

  .bus-card {
    background: var(--surface);
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow .18s ease, transform .18s ease, background 0.3s ease;
  }

  .bus-card:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }

  body.dark-mode .bus-card {
    background: linear-gradient(165deg, var(--surface-raised) 0%, var(--surface) 60%);
    border-color: rgba(212,176,116,0.07);
  }

  body.dark-mode .bus-card:hover {
    border-color: rgba(212,176,116,0.22);
  }

  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px 10px;
  }

  .bus-id {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .bus-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-color) 18%, transparent);
    background: var(--dot-color);
  }

  body.dark-mode .bus-dot {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-color) 22%, transparent);
  }

  .bus-name {
    font-family: 'Noto Serif Bengali', serif;
    font-size: 18px;
    color: var(--ink);
    line-height: 1.3;
  }

  body.dark-mode .bus-name {
    letter-spacing: 0.01em;
  }

  .loop-badge {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--dot-color);
    background: color-mix(in srgb, var(--dot-color) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--dot-color) 30%, transparent);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .span-chip {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--line-soft);
    border-radius: var(--radius-pill);
    padding: 4px 10px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  body.dark-mode .span-chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
  }

  body.dark-mode .loop-badge {
    background: color-mix(in srgb, var(--dot-color) 16%, transparent);
    border-color: color-mix(in srgb, var(--dot-color) 40%, transparent);
  }

  .driver-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--line);
  }

  .driver-row > div {
    min-width: 0;
    overflow-wrap: break-word;
  }

  .driver-row strong {
    color: var(--ink);
    font-weight: 600;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--dot-color) 12%, transparent);
    color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--dot-color) 30%, transparent);
  }

  body.dark-mode .status-badge {
    background: color-mix(in srgb, var(--dot-color) 15%, transparent);
    border-color: color-mix(in srgb, var(--dot-color) 36%, transparent);
  }

  .status-badge.waiting {
    background: rgba(255, 170, 0, 0.12);
    color: #d97706;
    border-color: rgba(217, 119, 6, 0.3);
  }

  body.dark-mode .status-badge.waiting {
    background: rgba(214, 168, 93, 0.14);
    color: #E3B673;
    border-color: rgba(214, 168, 93, 0.35);
  }

  .status-badge.completed {
    background: rgba(136, 144, 162, 0.12);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  body.dark-mode .status-badge.completed {
    background: rgba(113, 121, 142, 0.14);
    color: var(--muted);
    border-color: var(--line);
  }

  .call-btn {
    background: #22c55e;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 6px rgba(34, 197, 94, 0.3);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }

  .call-btn:hover {
    background: #16a34a;
    transform: scale(1.04);
  }

  body.dark-mode .call-btn {
    background: linear-gradient(135deg, #3FAF92, #227A63);
    color: #F2EEE4;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 3px 10px -2px rgba(63,175,146,0.35), 0 1px 2px rgba(0,0,0,0.3);
  }

  body.dark-mode .call-btn:hover {
    background: linear-gradient(135deg, #4CC2A3, #2C9179);
  }

  .route {
    position: relative;
    padding-left: 22px;
  }

  .route::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: linear-gradient(to bottom, var(--dot-color), color-mix(in srgb, var(--dot-color) 25%, transparent));
    border-radius: 2px;
  }

  .stop-row {
    position: relative;
    padding: 5px 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 14px;
    border-radius: 6px;
    transition: background-color 0.2s ease;
  }

  .stop-row::before {
    content: '';
    position: absolute;
    left: -22px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface);
    border: 2.5px solid var(--dot-color);
  }

  .stop-row.has-time::before {
    background: var(--dot-color);
  }

  .stop-row:first-child::before {
    width: 13px;
    height: 13px;
    left: -23.5px;
  }

  .stop-row:last-child::before {
    background: var(--ink);
    border-color: var(--ink);
  }

  .stop-row.is-active {
    background: color-mix(in srgb, var(--dot-color) 12%, transparent);
    font-weight: 600;
  }

  .stop-row.is-active::before {
    background: #22c55e !important;
    border-color: #16a34a !important;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25);
  }

  body.dark-mode .stop-row.is-active {
    background: color-mix(in srgb, var(--dot-color) 16%, transparent);
  }

  body.dark-mode .stop-row.is-active::before {
    background: #4FB8A0 !important;
    border-color: #4FB8A0 !important;
    box-shadow: 0 0 0 4px rgba(79, 184, 160, 0.24);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
    font-size: 11px;
    background: #22c55e;
    color: #ffffff;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    animation: pulse 1.8s infinite;
  }

  body.dark-mode .live-badge {
    background: linear-gradient(135deg, #5CC7AE, #3FA88C);
    color: #0A0A0E;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.75; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }

  .stop-time {
    flex-shrink: 0;
    min-width: 54px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--dot-color);
    font-size: 13px;
  }

  .stop-row:not(.has-time) .stop-time {
    color: var(--muted);
    font-weight: 400;
  }

  .stop-name {
    color: var(--ink);
    line-height: 1.4;
  }

  .stop-row:last-child .stop-name {
    font-weight: 600;
  }

  .no-time-note {
    display: inline-block;
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 15px;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius-card);
    grid-column: 1 / -1;
  }

  body.dark-mode .no-result {
    border-color: rgba(212,176,116,0.22);
  }

  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    padding: 8px 0 32px;
  }

  /* ===== Day & Night theme toggle switch ===== */
  /* Original control is authored at 220x100; scaled down uniformly to sit
     inline with the header's pill widgets. All internal pixel values
     (knob travel, crater offsets, svg paths) are left untouched — the
     wrapper below just scales the whole thing visually. */
  .theme-toggle-wrap {
    width: 70px;
    height: 32px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .theme-toggle-wrap .toggle-switch {
    transform: scale(0.32);
    transform-origin: top left;
  }

  .toggle-switch {
    position: relative;
    width: 220px;
    height: 100px;
    cursor: pointer;
    user-select: none;
    display: block;
  }

  .toggle-switch input {
    display: none;
  }

  .toggle-switch .track {
    position: absolute;
    inset: 0;
    border-radius: 50px;
    background: linear-gradient(180deg, #4b8bc8 0%, #7db3e3 100%);
    box-shadow:
      inset 0 8px 12px rgba(11, 35, 61, 0.45),
      inset 0 -4px 6px rgba(255, 255, 255, 0.6),
      0 12px 25px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    transition: background 0.6s ease;
  }

  .toggle-switch .clouds-svg {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
  }

  .toggle-switch .stars-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transform: translateY(-12px);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
  }

  .toggle-switch .knob-container {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 84px;
    height: 84px;
    perspective: 600px;
    transition: transform 0.6s cubic-bezier(0.68, -0.4, 0.265, 1.35);
    z-index: 10;
  }

  .toggle-switch .knob {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 50%;
  }

  .toggle-switch .sun,
  .toggle-switch .moon {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
  }

  .toggle-switch .sun {
    background: radial-gradient(circle at 35% 35%, #ffdb29 0%, #f1a80a 85%, #d98e00 100%);
    box-shadow:
      inset 3px 3px 6px rgba(255, 255, 255, 0.8),
      inset -4px -4px 8px rgba(160, 90, 0, 0.5),
      0 6px 15px rgba(0, 0, 0, 0.2);
  }

  .toggle-switch .moon {
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdde1 70%, #b8bcbe 100%);
    transform: rotateY(180deg);
    box-shadow:
      inset 3px 3px 6px rgba(255, 255, 255, 0.9),
      inset -4px -4px 8px rgba(80, 90, 100, 0.4),
      0 6px 15px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }

  .toggle-switch .crater {
    position: absolute;
    background: #a2aab5;
    border-radius: 50%;
    box-shadow:
      inset 2px 2px 4px rgba(0, 0, 0, 0.35),
      inset -1px -1px 2px rgba(255, 255, 255, 0.5);
  }

  .toggle-switch .crater-1 { top: 16px; right: 28px; width: 18px; height: 18px; }
  .toggle-switch .crater-2 { bottom: 18px; right: 22px; width: 30px; height: 30px; }
  .toggle-switch .crater-3 { bottom: 26px; left: 16px; width: 16px; height: 16px; }

  .toggle-switch input:checked + .track {
    background: linear-gradient(180deg, #0D0E14 0%, #1C1D26 100%);
  }

  .toggle-switch input:checked + .track .clouds-svg {
    transform: translateY(45px);
    opacity: 0;
  }

  .toggle-switch input:checked + .track .stars-svg {
    opacity: 1;
    transform: translateY(0);
  }

  .toggle-switch input:checked ~ .knob-container {
    transform: translateX(120px);
  }

  .toggle-switch input:checked ~ .knob-container .knob {
    transform: rotateY(180deg);
  }

  /* ===== Language switch (EN / বাংলা) ===== */
  /* Original control is authored at 200x60; scaled down uniformly to sit
     inline with the header's pill widgets, same technique as the theme
     toggle above. The outer pill uses the app's surface/line/shadow
     variables (instead of the original's fixed dark-glass look) so it
     reads correctly in both light and dark mode; the sliding thumb,
     floating-letter animation, and EN/blue vs BN/green colors are kept
     as given. */
  .lang-switch-wrap {
    width: 107px;
    height: 32px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .lang-switch-wrap .lang-switch {
    transform: scale(0.5333);
    transform-origin: top left;
  }

  .lang-toggle-input {
    display: none;
  }

  .lang-switch {
    position: relative;
    width: 200px;
    height: 60px;
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    transition: border-color 0.4s, box-shadow 0.4s, background 0.3s ease;
    user-select: none;
  }

  .lang-switch .bg-characters {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .lang-switch .bg-characters span {
    position: absolute;
    font-weight: 700;
    user-select: none;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .lang-switch .en-bg span {
    color: #38bdf8;
    opacity: 0.18;
  }
  .lang-switch .en-bg span:nth-child(1) { top: 12%; left: 12%; font-size: 20px; animation: langFloat 3.5s infinite ease-in-out; }
  .lang-switch .en-bg span:nth-child(2) { top: 48%; left: 32%; font-size: 15px; animation: langFloat 4.2s infinite ease-in-out 0.5s; }
  .lang-switch .en-bg span:nth-child(3) { top: 18%; left: 68%; font-size: 22px; animation: langFloat 3.8s infinite ease-in-out 1s; }
  .lang-switch .en-bg span:nth-child(4) { top: 54%; left: 82%; font-size: 16px; animation: langFloat 4.5s infinite ease-in-out 1.5s; }

  .lang-switch .bn-bg span {
    color: #4ade80;
    opacity: 0;
    transform: translateY(20px) scale(0.5) rotate(-15deg);
  }
  .lang-switch .bn-bg span:nth-child(1) { top: 10%; left: 14%; font-size: 22px; animation: langFloat 3.5s infinite ease-in-out; }
  .lang-switch .bn-bg span:nth-child(2) { top: 50%; left: 34%; font-size: 18px; animation: langFloat 4.2s infinite ease-in-out 0.5s; }
  .lang-switch .bn-bg span:nth-child(3) { top: 14%; left: 66%; font-size: 24px; animation: langFloat 3.8s infinite ease-in-out 1s; }
  .lang-switch .bn-bg span:nth-child(4) { top: 52%; left: 80%; font-size: 20px; animation: langFloat 4.5s infinite ease-in-out 1.5s; }

  .lang-switch .slider-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55), background 0.5s, box-shadow 0.5s;
    z-index: 2;
  }

  .lang-switch .labels {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 3px;
    z-index: 3;
    pointer-events: none;
  }

  .lang-switch .label-en,
  .lang-switch .label-bn {
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    transition: color 0.4s;
  }

  .lang-switch .label-en { color: #ffffff; }
  .lang-switch .label-bn { color: var(--muted); }

  @keyframes langFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(6deg); }
  }

  .lang-toggle-input:checked + .lang-switch {
    border-color: rgba(74, 222, 128, 0.35);
    box-shadow: var(--shadow-card), 0 0 20px rgba(74, 222, 128, 0.15);

    transform: translateY(-20px) scale(0.5) rotate(15deg);
  }

    transform: translateY(0) scale(1) rotate(0deg);

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      let s = now.getSeconds();
      const isPM = h >= 12;
      h = h % 12 || 12;

      let timeStr;
      if (currentLang === 'bn') {
        const ampm = isPM ? 'পিএম' : 'এএম';
        const pad = n => n < 10 ? '০' + convertDigits(n.toString(), true) : convertDigits(n.toString(), true);
        timeStr = `⏰ ${pad(h)}:${pad(m)}:${pad(s)} ${ampm}`;
      } else {
        const pad = n => n < 10 ? '0' + n : '' + n;
        timeStr = `⏰ ${pad(h)}:${pad(m)}:${pad(s)} ${isPM ? 'PM' : 'AM'}`;
      }
      document.getElementById('digitalClock').textContent = timeStr;
    }

    function parseBanglaTime(timeStr) {
      if (!timeStr || timeStr === '—') return null;
      
      const parts = timeStr.trim().split(/\s+/);
      const timeOnly = parts[0];
      const modifier = parts[1] ? parts[1].toUpperCase() : '';

      const enStr = convertDigits(timeOnly, false);
      let [hours, minutes] = enStr.split(':').map(Number);
      
      if (isNaN(hours) || isNaN(minutes)) return null;

      if (modifier === 'PM' && hours < 12) hours += 12;
      if (modifier === 'AM' && hours === 12) hours = 0;
      
      if (!modifier) {
        if (hours >= 1 && hours <= 5) hours += 12;
      }

      return hours * 60 + minutes;
    }

    function isoDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // Returns { isOff, bn, en } — bn/en describe the reason (weekly off or a
    // named holiday) when isOff is true; both empty when service runs today.
    function getOffDayInfo(now) {
      const day = now.getDay(); // 0=Sun ... 5=Fri, 6=Sat
      if (day === 5 || day === 6) {
        return { isOff: true, bn: 'সাপ্তাহিক ছুটি (শুক্র/শনিবার)', en: 'Weekly off (Friday/Saturday)' };
      }
      const today = isoDate(now);
      for (const h of HOLIDAY_RANGES) {
        if (today >= h.start && today <= h.end) {
          return { isOff: true, bn: h.bn, en: h.en };
        }
      }
      return { isOff: false, bn: '', en: '' };
    }

    function getBusStatus(stoppages, busNameStr) {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      // Short-circuit before any time-based logic so stale "moving"/
      // "completed" states never show on a day the bus doesn't run.
      const offInfo = getOffDayInfo(now);
      if (offInfo.isOff) {
        return { kind: 'weekend_off', activeIdx: -1, isCompleted: false, isWaiting: true, data: offInfo };
      }

      const validStops = stoppages
        .map((s, idx) => ({ timeMin: parseBanglaTime(s.time), idx }))
        .filter(s => s.timeMin !== null);

      if (validStops.length === 0) {
        return { kind: 'none', activeIdx: -1, isCompleted: false, isWaiting: false };
      }

      const firstStop = validStops[0];
      const firstStopMin = firstStop.timeMin;
      const lastStopMin = validStops[validStops.length - 1].timeMin;

      // Case 1: Trip Not Started Yet
      if (currentMinutes < firstStopMin) {
        const minsLeft = firstStopMin - currentMinutes;
        const hours = Math.floor(minsLeft / 60);
        const mins = minsLeft % 60;

        return {
          kind: 'not_started',
          activeIdx: firstStop.idx,
          isCompleted: false,
          isWaiting: true,
          data: { stopIdx: firstStop.idx, hours, mins }
        };
      }

      // Loop buses (চক্রাকার বাস) only have a time on the departure stop from
      // জবি — every waypoint until it returns is untimed. The arrival-buffer
      // logic below assumes the last known time is near the destination,
      // which is wrong here (it's the start of the loop), so handle these
      // separately instead of falling through.
      const isLoop = busNameStr && busNameStr.includes('চক্রাকার');
      if (isLoop && validStops.length === 1) {
        const LOOP_DURATION = 90; // minutes — rough estimate for a full round trip
        if (currentMinutes > firstStopMin + LOOP_DURATION) {
          return { kind: 'loop_ended', activeIdx: -1, isCompleted: true, isWaiting: false };
        }
        return { kind: 'loop_moving', activeIdx: firstStop.idx, isCompleted: false, isWaiting: false };
      }

      // Case 2: Service Completed
      if (currentMinutes > lastStopMin + 30) {
        return { kind: 'completed', activeIdx: -1, isCompleted: true, isWaiting: false };
      }

      // Case 3: Bus On the Move
      for (let i = 0; i < validStops.length - 1; i++) {
        const curMin = validStops[i].timeMin;
        const nextMin = validStops[i + 1].timeMin;
        if (currentMinutes >= curMin && currentMinutes <= nextMin) {
          return {
            kind: 'moving',
            activeIdx: validStops[i + 1].idx,
            isCompleted: false,
            isWaiting: false,
            data: { fromIdx: validStops[i].idx, toIdx: validStops[i + 1].idx }
          };
        }
      }

      return {
        kind: 'near_campus',
        activeIdx: validStops[validStops.length - 1].idx,
        isCompleted: false,
        isWaiting: false
      };
    }

    // Turns a getBusStatus() result into localized display text for the
    // currently selected language.
    function describeStatus(bus, status) {
      switch (status.kind) {
        case 'weekend_off': {
          const reason = status.data ? (currentLang === 'bn' ? status.data.bn : status.data.en) : '';
          return t('dayOff', reason);
        }
        case 'not_started': {
          const { hours, mins } = status.data;
          const timeStr = fmtTime(bus.stoppages[status.data.stopIdx].time);
          let remaining;
          if (hours > 0 && mins > 0) remaining = `${fmtNum(hours)} ${t('hour')} ${fmtNum(mins)} ${t('min')}`;
          else if (hours > 0) remaining = `${fmtNum(hours)} ${t('hour')}`;
          else remaining = `${fmtNum(mins)} ${t('min')}`;
          return t('notStarted', timeStr, remaining);
        }
        case 'completed':
          return t('completed');
        case 'moving': {
          const from = stopName(bus.stoppages[status.data.fromIdx]);
          const to = stopName(bus.stoppages[status.data.toIdx]);
          return t('moving', from, to);
        }
        case 'near_campus':
          return t('nearCampus');
        case 'loop_moving':
          return t('loopMoving');
        case 'loop_ended':
          return t('loopEnded');
        default:
          return '';
      }
    }

    function displayBuses(busList, allCount) {
      const resultsDiv = document.getElementById('results');
      const countEl = document.getElementById('resultCount');
      resultsDiv.innerHTML = '';

      countEl.textContent = busList.length === allCount
        ? t('totalBuses', fmtNum(allCount))
        : t('foundBuses', fmtNum(busList.length));

      if (busList.length === 0) {
        resultsDiv.innerHTML = `<div class="no-result">${t('noResult')}</div>`;
        return;
      }

      busList.forEach((bus) => {
        const originalIndex = buses.indexOf(bus);
        const color = colorForIndex(originalIndex);

        const card = document.createElement('div');
        card.className = 'bus-card';
        card.style.setProperty('--dot-color', color);

        const timedStops = bus.stoppages.filter(s => s.time);
        const hasAnyTime = timedStops.length > 0;
        const isLoop = bus.bus_name.includes('চক্রাকার');

        const busStatus = getBusStatus(bus.stoppages, bus.bus_name);
        const statusText = describeStatus(bus, busStatus);
        const activeStopIndex = busStatus.activeIdx;

        const spanChip = hasAnyTime
          ? `<span class="span-chip">${fmtTime(timedStops[0].time)} → ${t('stops', fmtNum(bus.stoppages.length))}</span>`
          : `<span class="span-chip">${t('stops', fmtNum(bus.stoppages.length))}</span>`;

        const stopRowsHtml = bus.stoppages.map((s, idx) => {
          const isActive = idx === activeStopIndex;
          const activeBadge = isActive && statusText && !busStatus.isCompleted && !busStatus.isWaiting
            ? `<span class="live-badge">${statusText}</span>` 
            : '';

          return `<div class="stop-row ${s.time ? 'has-time' : ''} ${isActive && !busStatus.isWaiting ? 'is-active' : ''}">
            <span class="stop-time">${fmtTime(s.time) || '—'}</span>
            <span class="stop-name">${stopName(s)} ${activeBadge}</span>
          </div>`;
        }).join('');

        const callBtnHtml = bus.phone
          ? `<a href="tel:${convertDigits(bus.phone, false).replace(/\s+/g, '')}" class="call-btn">${t('call')}</a>`
          : '';

        let statusBoxHtml = '';
        if (busStatus.isWaiting) {
          statusBoxHtml = `<div class="status-badge waiting">${statusText}</div>`;
        } else if (busStatus.isCompleted) {
          statusBoxHtml = `<div class="status-badge completed">${statusText}</div>`;
        }

        card.innerHTML = `
          <div class="card-head">
            <div class="bus-id">
              <span class="bus-dot"></span>
              <span class="bus-name">${busName(bus)}</span>
              ${isLoop ? `<span class="loop-badge">${t('loop')}</span>` : ''}
            </div>
            ${spanChip}
          </div>
          <div class="driver-row">
            <div><strong>${t('driver')}</strong> ${driverName(bus)}</div>
            ${callBtnHtml}
          </div>
          ${statusBoxHtml}
          <div class="route">${stopRowsHtml}</div>
          ${hasAnyTime ? '' : `<span class="no-time-note">${t('noTime')}</span>`}
        `;

        resultsDiv.appendChild(card);
      });
    }

    function runSearch() {
      const rawTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      document.getElementById('clearSearchBtn').classList.toggle('visible', rawTerm.length > 0);

      if (!rawTerm) {
        displayBuses(buses, buses.length);
        return;
      }

      const bnTerm = convertDigits(rawTerm, true);
      const enTerm = convertDigits(rawTerm, false);

      const filteredBuses = buses.filter(bus => {
        const nameMatch = bus.bus_name.toLowerCase().includes(rawTerm) || bus.bus_name.includes(bnTerm) ||
          bus.bus_name_en.toLowerCase().includes(rawTerm);
        const driverMatch = bus.driver.toLowerCase().includes(rawTerm) || bus.driver.includes(bnTerm) ||
          bus.driver_en.toLowerCase().includes(rawTerm);
        const stopMatch = bus.stoppages.some(stop => 
          stop.name.toLowerCase().includes(rawTerm) || 
          stop.name.includes(bnTerm) ||
          stop.name_en.toLowerCase().includes(rawTerm) ||
          stop.time.includes(bnTerm) || 
          stop.time.includes(enTerm)
        );
        return nameMatch || driverMatch || stopMatch;
      });

      displayBuses(filteredBuses, buses.length);
    }

    document.getElementById('searchInput').addEventListener('input', runSearch);
    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      const input = document.getElementById('searchInput');
      input.value = '';
      input.focus();
      runSearch();
    });

    updateDayOffBanner();
    runSearch();

    // Re-render every 10s so live status/position stays fresh, whether or
    // not a search is active (previously this only refreshed when the
    // search box was empty), and re-check the day-off banner in case the
    // page is left open across midnight.
    setInterval(() => { updateDayOffBanner(); runSearch(); }, 10000);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
